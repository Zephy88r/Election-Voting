<!DOCTYPE html>
<html>
<head>
    <title>Login API Test</title>
</head>
<body>
    <h1>Login API Test</h1>
    <button onclick="testLogin()">Test Login</button>
    <div id="result"></div>

    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://127.0.0.1:8000/elections/api/voter/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: 'daru@gmail.com',
                        password: 'test123'
                    })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div style="color: green;">SUCCESS: ${JSON.stringify(data)}</div>`;
                    
                    // Test profile fetch
                    const profileResponse = await fetch('http://127.0.0.1:8000/elections/api/voter/profile/', {
                        method: 'GET',
                        credentials: 'include'
                    });
                    
                    const profileData = await profileResponse.json();
                    console.log('Profile data:', profileData);
                    
                    resultDiv.innerHTML += `<div style="color: blue;">PROFILE: ${JSON.stringify(profileData)}</div>`;
                } else {
                    resultDiv.innerHTML = `<div style="color: red;">ERROR: ${JSON.stringify(data)}</div>`;
                }
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<div style="color: red;">NETWORK ERROR: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
