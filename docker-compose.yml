version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: voting_system
      MYSQL_USER: voting_user
      MYSQL_PASSWORD: voting_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    build: .
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=your-production-secret-key-here
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,your-domain.com
      - CORS_ALLOWED_ORIGINS=https://your-frontend-domain.com
      - CSRF_TRUSTED_ORIGINS=https://your-frontend-domain.com
      - DATABASE_URL=mysql://voting_user:voting_password@db:3306/voting_system
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app
      - static_files:/app/staticfiles

  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    environment:
      - NODE_ENV=production

volumes:
  mysql_data:
  static_files: